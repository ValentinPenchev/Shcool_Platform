<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Присъствие на ученици</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">

    </div>

    <div class="student" id="student15">
        <img src="girl.png" alt="Ученик 15" class="avatar">
        <button class="status-button absent" onclick="toggleAttendance(this)">Сияна Петкова</button>
    </div>

    <script>
        function toggleAttendance(button) {
            if (button.classList.contains('present')) {
                button.classList.remove('present');
                button.classList.add('absent');
                button.innerHTML = button.innerHTML.replace('<br>(Присъства)', '');
            } else {
                button.classList.remove('absent');
                button.classList.add('present');
                button.innerHTML += '<br>(Присъства)';;
            }
            button.classList.add('pulse');
            setTimeout(() => button.classList.remove('pulse'), 500);
        }
    </script>
</body>
</html>
